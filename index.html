<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FF4F00" />
    
    <!-- Primary Meta Tags for BetaList & Search Engines -->
    <title>Tautan Lumina - Minimalist Smart Bookmark & Note Manager</title>
    <meta name="title" content="Tautan Lumina - Minimalist Smart Bookmark & Note Manager" />
    <meta name="description" content="Tautan Lumina is an ultra-minimalist smart bookmark and note manager. Auto-extract titles from URLs, organize links into encrypted PIN folders, import HTML bookmarks, and sync across devices." />
    <meta name="keywords" content="Tautan Lumina, Lumina, bookmark manager, smart bookmarks, note taking app, url organizer, netscape html import, appwrite sync, link saver" />
    <meta name="author" content="Tautan Lumina" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tautan Lumina" />
    <link rel="canonical" href="https://tautanlumina.appwrite.network/" />

    <!-- Open Graph / Facebook / BetaList Scraper -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tautanlumina.appwrite.network/" />
    <meta property="og:title" content="Tautan Lumina - Minimalist Smart Bookmark & Note Manager" />
    <meta property="og:description" content="Tautan Lumina is an ultra-minimalist smart bookmark and note manager. Auto-extract titles from URLs, organize links into encrypted PIN folders, import HTML bookmarks, and sync across devices." />
    <meta property="og:image" content="https://tautanlumina.appwrite.network/icon.svg" />
    <meta property="og:site_name" content="Tautan Lumina" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tautanlumina.appwrite.network/" />
    <meta name="twitter:title" content="Tautan Lumina - Minimalist Smart Bookmark & Note Manager" />
    <meta name="twitter:description" content="Tautan Lumina is an ultra-minimalist smart bookmark and note manager. Auto-extract titles from URLs, organize links into encrypted PIN folders, import HTML bookmarks, and sync across devices." />
    <meta name="twitter:image" content="https://tautanlumina.appwrite.network/icon.svg" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Schema.org Structured Data for Product Launch Platforms -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Tautan Lumina",
      "operatingSystem": "Web, iOS, Android",
      "applicationCategory": "ProductivityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Tautan Lumina is an ultra-minimalist smart bookmark and note manager. Auto-extract titles from URLs, organize links into encrypted PIN folders, import Netscape HTML bookmarks, and sync seamlessly across all devices.",
      "featureList": [
        "Auto-Extract Titles for Bookmarks",
        "Encrypted 4-digit PIN Folder Locking",
        "Netscape HTML & JSON Bookmark Import/Export",
        "Cross-Device Cloud Sync with Appwrite",
        "Offline-First Storage"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- App Loading Splash State (Replaced immediately when React mounts) -->
      <div id="initial-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #faf8f5; font-family: system-ui, -apple-system, sans-serif; color: #131313; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; background-color: #FF4F00; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(255, 79, 0, 0.3); margin-bottom: 16px; animation: pulse 1.8s infinite ease-in-out;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.5px; color: #131313; margin-bottom: 4px;">TautanLumina</div>
        <div id="splash-subtext" style="font-size: 12px; font-weight: 600; color: #FF4F00; text-transform: uppercase; letter-spacing: 0.5px;">Memuat Aplikasi...</div>
        <div id="splash-reload" style="display: none; margin-top: 16px;">
          <button onclick="window.location.reload(true)" style="padding: 8px 18px; background-color: #FF4F00; color: #ffffff; font-weight: 600; font-size: 13px; border: none; border-radius: 10px; cursor: pointer; shadow: 0 4px 12px rgba(255,79,0,0.2);">Muat Ulang Aplikasi</button>
        </div>
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback timeout: if React hasn't replaced initial splash in 5s, offer manual reload
      setTimeout(function() {
        var splash = document.getElementById('initial-splash');
        if (splash) {
          var reloadBtn = document.getElementById('splash-reload');
          var subtext = document.getElementById('splash-subtext');
          if (subtext) subtext.innerText = 'MEMUAT AGAK LAMA...';
          if (reloadBtn) reloadBtn.style.display = 'block';
        }
      }, 5000);
    </script>
  </body>
</html>
